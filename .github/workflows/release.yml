name: Build & Release (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.0)"
        required: true
        type: string
      draft:
        description: "Create as a draft release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"
  OPTIMIZE: ReleaseFast

jobs:
  build-windows:
    name: Build rswap.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build (release)
        run: zig build -Doptimize=${{ env.OPTIMIZE }} -Dtarget=x86_64-windows

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Ship the exe together with the example config.
          Copy-Item zig-out/bin/rswap.exe dist/
          Copy-Item rswap.conf dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath rswap-windows-x86_64.zip -Force
          Write-Host "Produced artifact:"
          Get-Item rswap-windows-x86_64.zip | Format-List Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rswap-windows-x86_64
          path: rswap-windows-x86_64.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: rswap-windows-x86_64.zip
